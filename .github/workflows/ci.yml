name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build server
        run: npm run build

      - name: Verify docs match implementation
        run: npm run verify

      - name: Smoke-test MCP tools over stdio
        run: node scripts/smoke-tools.mjs
